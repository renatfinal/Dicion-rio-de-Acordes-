<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f12" />
      <stop offset="100%" stop-color="#162026" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="6" />
  
  <!-- Subtle circular glow behind emblem -->
  <circle cx="256" cy="256" r="160" fill="#06b6d4" fill-opacity="0.08" />

  <!-- Piano Keyboard Minimalist Accent at bottom -->
  <g transform="translate(136, 340)">
    <!-- White keys -->
    <rect x="0" y="0" width="38" height="56" rx="6" fill="#f8fafc" />
    <rect x="42" y="0" width="38" height="56" rx="6" fill="#f8fafc" />
    <rect x="84" y="0" width="38" height="56" rx="6" fill="#f8fafc" />
    <rect x="126" y="0" width="38" height="56" rx="6" fill="#f8fafc" />
    <rect x="168" y="0" width="38" height="56" rx="6" fill="#f8fafc" />
    <rect x="210" y="0" width="38" height="56" rx="6" fill="#f8fafc" />
    <!-- Black keys -->
    <rect x="26" y="0" width="22" height="34" rx="3" fill="#0f172a" />
    <rect x="68" y="0" width="22" height="34" rx="3" fill="#0f172a" />
    <rect x="152" y="0" width="22" height="34" rx="3" fill="#0f172a" />
    <rect x="194" y="0" width="22" height="34" rx="3" fill="#0f172a" />
  </g>

  <!-- Musical Double Note Symbol -->
  <g fill="url(#cyanGrad)">
    <!-- Note Heads -->
    <ellipse cx="190" cy="270" rx="36" ry="26" transform="rotate(-20 190 270)" />
    <ellipse cx="320" cy="235" rx="36" ry="26" transform="rotate(-20 320 235)" />
    <!-- Note Stems -->
    <rect x="212" y="130" width="14" height="142" rx="7" />
    <rect x="342" y="95" width="14" height="142" rx="7" />
    <!-- Cross Beam -->
    <polygon points="212,130 356,95 356,128 212,163" />
  </g>

  <!-- Golden Chord Badge Accent -->
  <circle cx="370" cy="115" r="14" fill="url(#amberGrad)" />
  <circle cx="370" cy="115" r="7" fill="#ffffff" />
</svg>
